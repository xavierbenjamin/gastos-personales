<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Gastos Personales</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            padding: 30px 15px;
        }

        .contenedor {
            max-width: 950px;
            margin: auto;
        }

        /* ENCABEZADO */

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 45px;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 32px;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        header p {
            color: #94a3b8;
        }

        /* TARJETAS */

        .resumen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .tarjeta {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .tarjeta h3 {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .tarjeta .cantidad {
            font-size: 27px;
            font-weight: bold;
        }

        .saldo {
            color: #38bdf8;
        }

        .ingresos {
            color: #4ade80;
        }

        .gastos {
            color: #f87171;
        }

        /* FORMULARIO */

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-bottom: 20px;
            color: #f8fafc;
        }

        .formulario {
            display: grid;
            grid-template-columns: 1fr 150px 150px 130px;
            gap: 10px;
        }

        input,
        select {
            padding: 13px;
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
        }

        #agregar {
            border: none;
            border-radius: 9px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #agregar:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        /* MOVIMIENTOS */

        .movimientos {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 25px;
            border-radius: 16px;
        }

        .titulo-movimientos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .titulo-movimientos h2 {
            color: #f8fafc;
        }

        .filtros {
            display: flex;
            gap: 8px;
        }

        .filtro {
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            background: #334155;
            color: #cbd5e1;
        }

        .filtro.activo {
            background: #0284c7;
            color: white;
        }

        #listaMovimientos {
            list-style: none;
        }

        .movimiento {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            margin-bottom: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .informacion {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icono-movimiento {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 20px;
        }

        .icono-ingreso {
            background: rgba(34,197,94,0.15);
        }

        .icono-gasto {
            background: rgba(239,68,68,0.15);
        }

        .nombre {
            font-weight: bold;
            color: #f1f5f9;
        }

        .categoria {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .derecha {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .monto {
            font-size: 17px;
            font-weight: bold;
        }

        .monto.ingreso {
            color: #4ade80;
        }

        .monto.gasto {
            color: #f87171;
        }

        .eliminar {
            border: none;
            background: #7f1d1d;
            color: #fecaca;
            padding: 8px 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .eliminar:hover {
            background: #991b1b;
        }

        .vacio {
            text-align: center;
            padding: 35px;
            color: #64748b;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .formulario {
                grid-template-columns: 1fr 1fr;
            }

            #agregar {
                padding: 13px;
            }

        }

        @media (max-width: 600px) {

            body {
                padding: 20px 10px;
            }

            .resumen {
                grid-template-columns: 1fr;
            }

            .formulario {
                grid-template-columns: 1fr;
            }

            .titulo-movimientos {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .movimiento {
                align-items: flex-start;
            }

            .derecha {
                flex-direction: column;
                align-items: flex-end;
            }

            header h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

    <div class="contenedor">


        <!-- ENCABEZADO -->

        <header>

            <div class="logo">
                💳
            </div>

            <h1>
                Control de Gastos
            </h1>

            <p>
                Administra tu dinero de forma sencilla y organizada.
            </p>

        </header>


        <!-- RESUMEN -->

        <section class="resumen">


            <div class="tarjeta">

                <h3>
                    SALDO DISPONIBLE
                </h3>

                <div
                    class="cantidad saldo"
                    id="saldo">
                    $0.00
                </div>

            </div>


            <div class="tarjeta">

                <h3>
                    INGRESOS
                </h3>

                <div
                    class="cantidad ingresos"
                    id="totalIngresos">
                    $0.00
                </div>

            </div>


            <div class="tarjeta">

                <h3>
                    GASTOS
                </h3>

                <div
                    class="cantidad gastos"
                    id="totalGastos">
                    $0.00
                </div>

            </div>


        </section>


        <!-- FORMULARIO -->

        <section class="panel">

            <h2>
                ➕ Registrar movimiento
            </h2>


            <div class="formulario">


                <input
                    type="text"
                    id="descripcion"
                    placeholder="Descripción">


                <input
                    type="number"
                    id="monto"
                    placeholder="Monto"
                    min="0"
                    step="0.01">


                <select id="tipo">

                    <option value="gasto">
                        💸 Gasto
                    </option>

                    <option value="ingreso">
                        💰 Ingreso
                    </option>

                </select>


                <select id="categoria">

                    <option value="Comida">
                        🍔 Comida
                    </option>

                    <option value="Transporte">
                        🚗 Transporte
                    </option>

                    <option value="Estudios">
                        📚 Estudios
                    </option>

                    <option value="Entretenimiento">
                        🎮 Entretenimiento
                    </option>

                    <option value="Ropa">
                        👕 Ropa
                    </option>

                    <option value="Ahorro">
                        🏦 Ahorro
                    </option>

                    <option value="Otros">
                        📦 Otros
                    </option>

                </select>


                <button id="agregar">
                    Agregar
                </button>


            </div>

        </section>


        <!-- MOVIMIENTOS -->

        <section class="movimientos">


            <div class="titulo-movimientos">

                <h2>
                    📊 Movimientos
                </h2>


                <div class="filtros">

                    <button
                        class="filtro activo"
                        data-filtro="todos">
                        Todos
                    </button>

                    <button
                        class="filtro"
                        data-filtro="ingreso">
                        Ingresos
                    </button>

                    <button
                        class="filtro"
                        data-filtro="gasto">
                        Gastos
                    </button>

                </div>

            </div>


            <ul id="listaMovimientos"></ul>


            <div
                class="vacio"
                id="mensajeVacio">

                💰 No hay movimientos registrados.

            </div>


        </section>


    </div>


    <script>

        // ======================================
        // VARIABLES
        // ======================================

        let movimientos =
            JSON.parse(
                localStorage.getItem(
                    "movimientos"
                )
            ) || [];


        let filtroActual = "todos";


        const descripcion =
            document.getElementById(
                "descripcion"
            );

        const monto =
            document.getElementById(
                "monto"
            );

        const tipo =
            document.getElementById(
                "tipo"
            );

        const categoria =
            document.getElementById(
                "categoria"
            );

        const agregar =
            document.getElementById(
                "agregar"
            );

        const listaMovimientos =
            document.getElementById(
                "listaMovimientos"
            );

        const mensajeVacio =
            document.getElementById(
                "mensajeVacio"
            );


        // ======================================
        // AGREGAR MOVIMIENTO
        // ======================================

        agregar.addEventListener(
            "click",
            agregarMovimiento
        );


        function agregarMovimiento() {


            const texto =
                descripcion.value.trim();

            const cantidad =
                parseFloat(monto.value);


            if (texto === "") {

                alert(
                    "Escribe una descripción."
                );

                return;

            }


            if (
                isNaN(cantidad) ||
                cantidad <= 0
            ) {

                alert(
                    "Introduce un monto válido."
                );

                return;

            }


            const nuevoMovimiento = {

                id: Date.now(),

                descripcion: texto,

                monto: cantidad,

                tipo: tipo.value,

                categoria:
                    categoria.value

            };


            movimientos.push(
                nuevoMovimiento
            );


            guardarDatos();


            descripcion.value = "";

            monto.value = "";


            mostrarMovimientos();

        }


        // ======================================
        // MOSTRAR MOVIMIENTOS
        // ======================================

        function mostrarMovimientos() {


            listaMovimientos.innerHTML =
                "";


            const filtrados =
                movimientos.filter(
                    function(movimiento) {

                        if (
                            filtroActual ===
                            "todos"
                        ) {

                            return true;

                        }


                        return (
                            movimiento.tipo ===
                            filtroActual
                        );

                    }
                );


            if (filtrados.length === 0) {

                mensajeVacio.style.display =
                    "block";

            } else {

                mensajeVacio.style.display =
                    "none";

            }


            filtrados
                .slice()
                .reverse()
                .forEach(
                    function(movimiento) {


                        const li =
                            document.createElement(
                                "li"
                            );


                        li.className =
                            "movimiento";


                        const esIngreso =
                            movimiento.tipo ===
                            "ingreso";


                        li.innerHTML = `

                            <div class="informacion">

                                <div
                                    class="icono-movimiento
                                    ${esIngreso
                                        ? "icono-ingreso"
                                        : "icono-gasto"}">

                                    ${
                                        esIngreso
                                        ? "💰"
                                        : "💸"
                                    }

                                </div>


                                <div>

                                    <div class="nombre">

                                        ${movimiento.descripcion}

                                    </div>


                                    <div class="categoria">

                                        ${movimiento.categoria}

                                    </div>

                                </div>

                            </div>


                            <div class="derecha">

                                <div
                                    class="monto
                                    ${esIngreso
                                        ? "ingreso"
                                        : "gasto"}">

                                    ${
                                        esIngreso
                                        ? "+"
                                        : "-"
                                    }

                                    $${movimiento.monto.toFixed(2)}

                                </div>


                                <button
                                    class="eliminar"
                                    onclick="
                                    eliminarMovimiento(
                                    ${movimiento.id}
                                    )">

                                    🗑️

                                </button>

                            </div>

                        `;


                        listaMovimientos
                            .appendChild(li);

                    }
                );


            actualizarResumen();

        }


        // ======================================
        // ELIMINAR
        // ======================================

        function eliminarMovimiento(id) {


            movimientos =
                movimientos.filter(
                    function(movimiento) {

                        return (
                            movimiento.id !== id
                        );

                    }
                );


            guardarDatos();


            mostrarMovimientos();

        }


        // ======================================
        // ACTUALIZAR RESUMEN
        // ======================================

        function actualizarResumen() {


            let ingresos = 0;

            let gastos = 0;


            movimientos.forEach(
                function(movimiento) {


                    if (
                        movimiento.tipo ===
                        "ingreso"
                    ) {

                        ingresos +=
                            movimiento.monto;

                    } else {

                        gastos +=
                            movimiento.monto;

                    }

                }
            );


            const saldo =
                ingresos - gastos;


            document.getElementById(
                "totalIngresos"
            ).textContent =
                "$" + ingresos.toFixed(2);


            document.getElementById(
                "totalGastos"
            ).textContent =
                "$" + gastos.toFixed(2);


            document.getElementById(
                "saldo"
            ).textContent =
                "$" + saldo.toFixed(2);

        }


        // ======================================
        // FILTROS
        // ======================================

        document
            .querySelectorAll(".filtro")
            .forEach(
                function(boton) {


                    boton.addEventListener(
                        "click",
                        function() {


                            document
                                .querySelectorAll(
                                    ".filtro"
                                )
                                .forEach(
                                    function(btn) {

                                        btn.classList
                                            .remove(
                                                "activo"
                                            );

                                    }
                                );


                            boton.classList.add(
                                "activo"
                            );


                            filtroActual =
                                boton.dataset.filtro;


                            mostrarMovimientos();

                        }
                    );

                }
            );


        // ======================================
        // GUARDAR DATOS
        // ======================================

        function guardarDatos() {

            localStorage.setItem(
                "movimientos",
                JSON.stringify(
                    movimientos
                )
            );

        }


        // ======================================
        // INICIAR
        // ======================================

        mostrarMovimientos();

    </script>

</body>

</html>
